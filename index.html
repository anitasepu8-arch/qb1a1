<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quantum Branding 1:1 | Tu marca no necesita más contenido. Necesita dirección.</title>
<meta name="description" content="Proceso privado de estrategia, construcción e implementación acompañada para marcas y negocios que ya tienen una base y quieren llevar su posicionamiento al nivel de su negocio.">
<meta property="og:title" content="Quantum Branding 1:1">
<meta property="og:description" content="Tu marca no necesita más contenido. Necesita dirección.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
<style>
  :root{
    --wine:#4E0000;
    --wine-deep:#2a0000;
    --wine-mid:#6b0f0f;
    --gold:#D4AF78;
    --gold-soft:#e8cfa3;
    --pearl:#F7F3EC;
    --smoke:#2b2626;
    --ink:#1b1616;
    --muted:#6f6560;
    --line:rgba(212,175,120,.28);
    --bg:#F7F3EC;
    --bg-alt:#efe8dc;
    --card:#ffffff;
    --text:#1b1616;
    --text-soft:#4a403c;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#140c0c;
      --bg-alt:#1b1111;
      --card:#221616;
      --text:#f4ede2;
      --text-soft:#cdbfb1;
      --muted:#a8998b;
      --line:rgba(212,175,120,.25);
    }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:'Inter',system-ui,sans-serif;
    background:var(--bg);color:var(--text);
    line-height:1.65;font-size:17px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:860px;margin:0 auto;padding:0 22px}
  .wrap-wide{max-width:1040px;margin:0 auto;padding:0 22px}
  h1,h2,h3{font-family:'Playfair Display',Georgia,serif;font-weight:600;line-height:1.15;letter-spacing:-.01em}
  .eyebrow{
    font-size:12px;letter-spacing:.28em;text-transform:uppercase;font-weight:600;
    color:var(--gold);display:block;margin-bottom:18px;
  }
  section{padding:84px 0}

  /* HERO */
  .hero{
    background:
      radial-gradient(900px 500px at 80% -10%, rgba(212,175,120,.18), transparent 60%),
      radial-gradient(700px 500px at 0% 110%, rgba(107,15,15,.7), transparent 60%),
      linear-gradient(160deg,var(--wine-deep) 0%,var(--wine) 55%,#3a0505 100%);
    color:#f6efe4;text-align:center;padding:110px 0 100px;position:relative;overflow:hidden;
  }
  .hero::after{
    content:"";position:absolute;left:50%;bottom:0;transform:translateX(-50%);
    width:1px;height:60px;background:linear-gradient(to bottom,transparent,var(--gold));
  }
  .brand-tag{
    display:inline-block;border:1px solid var(--gold);color:var(--gold);
    padding:8px 20px;border-radius:999px;font-size:12px;letter-spacing:.3em;
    text-transform:uppercase;font-weight:600;margin-bottom:34px;
  }
  .hero h1{font-size:clamp(36px,6.4vw,66px);margin-bottom:26px}
  .hero h1 em{color:var(--gold);font-style:italic}
  .hero p.lead{font-size:clamp(18px,2.4vw,21px);max-width:620px;margin:0 auto 40px;color:#e6d9c6}
  .banner-final{
    background:var(--wine);padding:24px 22px;text-align:center;width:100%;
  }
  .banner-final p{
    color:var(--gold);font-size:18px;font-weight:600;
    font-family:'Playfair Display',serif;margin:0;
  }

  /* PROBLEMA */
  .problem{text-align:center}
  .problem .build{font-family:'Playfair Display',serif;font-size:clamp(22px,3.4vw,30px);line-height:1.5}
  .problem .build span{display:block;color:var(--text-soft)}
  .rule{width:60px;height:2px;background:var(--gold);margin:38px auto}
  .cracks{max-width:560px;margin:0 auto;text-align:left}
  .cracks p{
    padding:16px 0 16px 22px;border-left:2px solid var(--gold);margin-bottom:14px;
    color:var(--text-soft);font-size:18px;
  }
  .cracks p:last-child{margin-bottom:0}
  .punch{
    margin-top:46px;font-family:'Playfair Display',serif;font-size:clamp(24px,4vw,34px);
    color:var(--wine);font-style:italic;
  }
  @media (prefers-color-scheme: dark){.punch{color:var(--gold)}}

  /* PROCESO */
  .dark-band{
    background:linear-gradient(170deg,var(--wine-deep),var(--wine));
    color:#f6efe4;
  }
  .dark-band h2{color:#fff}
  .dark-band p{color:#e6d9c6}
  .center{text-align:center}
  h2{font-size:clamp(28px,4.6vw,44px);margin-bottom:24px}
  .section-intro{max-width:640px;margin:0 auto 14px;font-size:18px}
  .audit-list{list-style:none;max-width:420px;margin:30px auto 10px;text-align:left}
  .audit-list li{
    padding:13px 0 13px 34px;position:relative;border-bottom:1px solid rgba(212,175,120,.2);
    font-size:18px;
  }
  .audit-list li::before{content:"◆";position:absolute;left:0;color:var(--gold);font-size:12px;top:19px}
  .map{
    margin-top:44px;padding:30px;border:1px solid var(--gold);border-radius:6px;
    background:rgba(0,0,0,.18);
  }
  .map h3{color:var(--gold);font-size:28px;margin-bottom:6px}
  .diff{margin-top:70px}
  .diff h2{color:var(--gold)}
  .diff .sub{font-size:19px;max-width:560px;margin:0 auto 40px}
  .assets{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;text-align:left;margin-top:34px}
  .asset{
    padding:18px 20px;border:1px solid rgba(212,175,120,.3);border-radius:4px;
    background:rgba(255,255,255,.04);font-size:16px;color:#f1e7d6;
    display:flex;gap:12px;align-items:flex-start;
  }
  .asset b{color:var(--gold);font-family:'Playfair Display',serif;font-size:18px;min-width:22px}
  .asset.highlight{background:rgba(212,175,120,.14);border-color:var(--gold);font-weight:600}

  /* LLAMADA */
  .call .lead-p{max-width:640px;margin:0 auto 12px;font-size:19px;text-align:center;color:var(--text-soft)}
  .call .lead-p strong{color:var(--text)}
  .steps{margin-top:50px;display:grid;gap:18px}
  .step{
    background:var(--card);border:1px solid var(--line);border-radius:6px;padding:28px 28px 26px;
    display:grid;grid-template-columns:56px 1fr;gap:20px;align-items:start;
  }
  .step .n{
    font-family:'Playfair Display',serif;font-size:42px;color:var(--gold);line-height:1;font-weight:600;
  }
  .step h3{font-size:22px;margin-bottom:6px}
  .step p{color:var(--text-soft);font-size:16.5px}
  .honest{
    margin-top:42px;text-align:center;font-size:19px;color:var(--text-soft);
    max-width:620px;margin-left:auto;margin-right:auto;
  }
  .honest strong{color:var(--text)}

  /* PARA TI / NO PARA TI */
  .fit{background:var(--bg-alt)}
  .fit-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:40px}
